{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h1>{{ post.title }}</h1>
<p class="text-muted">{{ post.created_at|date:"d.m.Y" }} | Просмотры: {{ post.views_count }}</p>
<p>{{ post.content }}</p>
<a href="{% url 'blog_edit' post.pk %}" class="btn btn-warning">Редактировать</a>
<a href="{% url 'blog_delete' post.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'blog_list' %}" class="btn btn-secondary">Назад</a>
{% endblock %}
