{% extends 'base.html' %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
<h1>Удалить "{{ object.name }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'home' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
